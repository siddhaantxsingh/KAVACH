# Builds the KAVACH debug APKs (the one app + optional Network Watch) on every push to main and publishes them (plus the build log)
# as the GitHub Release "apks-latest". Download from the repo's Releases page.
name: build-apks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apks
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch sherpa-onnx AAR
        run: bash scripts/fetch_android_deps.sh
      - name: Build (parity tests + APKs)
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :core:test :guardian:assembleDebug :netwatch:assembleDebug 2>&1 | tee ../build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p dist
          cp android/guardian/build/outputs/apk/debug/guardian-debug.apk dist/kavach-debug.apk || true
          cp android/netwatch/build/outputs/apk/debug/netwatch-debug.apk dist/kavach-netwatch-debug.apk || true
          tail -c 900000 build.log > dist/build.log || true
          ls -la dist
      - name: Publish release apks-latest
        # replace the files in place (never delete the release), and only when the build succeeded,
        # so the download links always work
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apks-latest >/dev/null 2>&1; then
            gh release upload apks-latest dist/* --clobber
            gh release edit apks-latest --title "KAVACH debug APKs ${GITHUB_SHA::7}"
          else
            gh release create apks-latest dist/* --target "$GITHUB_SHA" --prerelease \
              --title "KAVACH debug APKs ${GITHUB_SHA::7}" \
              --notes "Built on every push. Install: adb install -r kavach-debug.apk (optional kavach-netwatch-debug.apk). Then scripts/push_models.sh --asr."
          fi
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view build-failed >/dev/null 2>&1 || gh release create build-failed --prerelease --title "Last failed build log" --notes "Log of the last failed build."
          gh release upload build-failed dist/build.log --clobber

  # Runs the freshly built apps on an Android emulator and saves screenshots of every main screen
  # (dark and light) to the release "ui-screens", so the look can be reviewed without a phone.
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch sherpa-onnx AAR
        run: bash scripts/fetch_android_deps.sh
      - name: Build emulator APKs
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon -PextraAbi=x86_64 :guardian:assembleDebug :netwatch:assembleDebug 2>&1 | tee ../screens-build.log | tail -40
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/ci_screens.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots; cp screens-build.log shots/ || true
          cd shots && zip -q -r ../ui-screens.zip . && cd ..
          gh release view ui-screens >/dev/null 2>&1 || gh release create ui-screens --prerelease --title "UI screenshots" --notes "Emulator screenshots of the latest build."
          gh release upload ui-screens ui-screens.zip --clobber
          gh release edit ui-screens --title "UI screenshots ${GITHUB_SHA::7}"
