# Builds the three KAVACH debug APKs on every push to main and publishes them (plus the build log)
# as the GitHub Release "apks-latest". Download from the repo's Releases page.
name: build-apks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apks
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch sherpa-onnx AAR
        run: bash scripts/fetch_android_deps.sh
      - name: Build (parity tests + 3 APKs)
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :core:test :guardian:assembleDebug :app:assembleDebug :netwatch:assembleDebug 2>&1 | tee ../build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p dist
          cp android/guardian/build/outputs/apk/debug/guardian-debug.apk dist/kavach-guardian-debug.apk || true
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/kavach-shield-debug.apk || true
          cp android/netwatch/build/outputs/apk/debug/netwatch-debug.apk dist/kavach-netwatch-debug.apk || true
          tail -c 900000 build.log > dist/build.log || true
          ls -la dist
      - name: Publish release apks-latest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apks-latest --yes --cleanup-tag || true
          gh release create apks-latest dist/* --target "$GITHUB_SHA" --prerelease \
            --title "KAVACH debug APKs ${GITHUB_SHA::7} (${{ job.status }})" \
            --notes "Built from ${GITHUB_SHA}. Status: ${{ job.status }}. Install: adb install kavach-shield-debug.apk, kavach-guardian-debug.apk (optional kavach-netwatch-debug.apk). Then scripts/push_models.sh --asr."
