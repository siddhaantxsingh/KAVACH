name: fetch-hi-asr
# Copies the Hindi streaming speech model (Apache-2.0, see models/asr/README.md) from Hugging Face to
# the release "dev-models", so the host tests in bench/ can run where Hugging Face is not reachable.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-hi-asr.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip -q install huggingface_hub
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for f in ["encoder.int8.onnx", "tokens.txt"]:
              hf_hub_download("mobilebytesensei/betterflow-hindi-streaming-ctc", f, local_dir="hi")
          from huggingface_hub import snapshot_download, list_repo_files
          print(list_repo_files("ippocode/indic-asr-onnx"))
          snapshot_download("ippocode/indic-asr-onnx", allow_patterns=["whisper-small-hi/*"], local_dir="w")
          PY
          ls -la hi w/whisper-small-hi
          cd w/whisper-small-hi && for f in *; do mv "$f" "../../hi/whisper-small-hi-$f"; done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-models -R $GITHUB_REPOSITORY >/dev/null 2>&1 || gh release create dev-models -R $GITHUB_REPOSITORY --prerelease --title "Dev models (host tests)" --notes "Hindi streaming ASR model (Apache-2.0) mirrored for host tests."
          gh release upload dev-models hi/* -R $GITHUB_REPOSITORY --clobber
