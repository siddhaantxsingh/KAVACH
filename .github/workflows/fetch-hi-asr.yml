name: fetch-hi-asr
# Mirrors Hindi speech models from Hugging Face to the release "dev-models", so host tests run where
# Hugging Face is not reachable and the phone setup script can fetch them from GitHub:
#  - mobilebytesensei/betterflow-hindi-streaming-ctc (streaming, Apache-2.0)            -> encoder.int8.onnx, tokens.txt
#  - ngiftsun/indicconformer-hi-int8-sherpa: AI4Bharat IndicConformer Hindi 120M CTC,
#    int8 for sherpa-onnx (model MIT by AI4Bharat; ONNX export CC-BY-4.0, trysem)         -> ic-hi-*
#  - NVIDIA Parakeet TDT-CTC 110M English (CC-BY-4.0), int8 export from the sherpa-onnx
#    asr-models release                                                                    -> parakeet-110m-en-*
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-hi-asr.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip -q install huggingface_hub
          python - <<'PY'
          from huggingface_hub import hf_hub_download, snapshot_download, list_repo_files
          for f in ["encoder.int8.onnx", "tokens.txt"]:
              hf_hub_download("mobilebytesensei/betterflow-hindi-streaming-ctc", f, local_dir="hi")
          print(list_repo_files("ngiftsun/indicconformer-hi-int8-sherpa"))
          snapshot_download("ngiftsun/indicconformer-hi-int8-sherpa", local_dir="ic")
          PY
          mkdir -p up
          cp hi/encoder.int8.onnx hi/tokens.txt up/
          for f in ic/*; do [ -f "$f" ] && cp "$f" "up/ic-hi-$(basename "$f")"; done
          curl -fsSL -o en.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8.tar.bz2
          tar xjf en.tar.bz2
          cp sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8/model.int8.onnx up/parakeet-110m-en-model.int8.onnx
          cp sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8/tokens.txt up/parakeet-110m-en-tokens.txt
          ls -la up
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-models -R $GITHUB_REPOSITORY >/dev/null 2>&1 || gh release create dev-models -R $GITHUB_REPOSITORY --prerelease --title "Dev models" --notes "Hindi speech models mirrored for host tests and the phone setup script."
          gh release upload dev-models up/* -R $GITHUB_REPOSITORY --clobber
