# KAVACH Llama 3.2 1B export: 4-bit groupwise linear weights with 8-bit dynamic
# activations (8da4w, group 32) + 4-bit embeddings, XNNPACK delegate (KleidiAI int4
# micro-kernels are used automatically on Arm CPUs), KV cache + custom SDPA op.
# Usage:
#   python -m executorch.extension.llm.export.export_llm --config models/llama/configs/kavach_xnnpack_8da4w.yaml \
#       +base.checkpoint=<meta_dir>/consolidated.00.pth +base.params=<meta_dir>/params.json \
#       +export.output_name=kavach_llama3_2_1b.pte
base:
  model_class: llama3_2
  metadata: '{"get_bos_id":128000, "get_eos_ids":[128009, 128001]}'

model:
  use_kv_cache: True
  use_sdpa_with_kv_cache: True
  dtype_override: fp32

export:
  max_seq_length: 2048
  max_context_length: 2048

quantization:
  qmode: 8da4w
  group_size: 32
  embedding_quantize: 4,32

backend:
  xnnpack:
    enabled: True
    extended_ops: True
